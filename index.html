<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swati Goyal</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    color: #fff;
    padding: 20px;
  }
  .card {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    padding: 40px 32px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  h1 {
    font-size: 24px;
    margin: 0 0 4px;
  }
  p.subtitle {
    margin: 0 0 28px;
    color: #cbd5e1;
    font-size: 14px;
    letter-spacing: 0.5px;
  }
  a.btn {
    display: block;
    text-decoration: none;
    padding: 14px 20px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 14px;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  a.btn:last-child { margin-bottom: 0; }
  a.btn:hover { transform: translateY(-2px); opacity: 0.92; }
  .btn-cv {
    background: #ffffff;
    color: #1e3a8a;
  }
  .btn-linkedin {
    background: #0A66C2;
    color: #ffffff;
  }
  .icon { margin-right: 8px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Swati Goyal</h1>
    <p class="subtitle">IIT Bombay</p>
    <a class="btn btn-cv" href="Swati_Goyal_CV.pdf" download>
      <span class="icon">📄</span>Download CV
    </a>
    <a class="btn btn-linkedin" href="https://www.linkedin.com/in/swatigoyaliitb" target="_blank" rel="noopener">
      <span class="icon">🔗</span>View LinkedIn Profile
    </a>
  </div>
</body>
</html>
